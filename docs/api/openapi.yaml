components:
  schemas:
    AlertRuleRequest:
      additionalProperties: false
      properties:
        channels:
          additionalProperties: true
          title: Channels
          type: object
        cooldown_minutes:
          default: 60
          maximum: 10080.0
          minimum: 1.0
          title: Cooldown Minutes
          type: integer
        filters:
          additionalProperties: true
          title: Filters
          type: object
        is_enabled:
          default: true
          title: Is Enabled
          type: boolean
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: AlertRuleRequest
      type: object
    AlertRuleResponse:
      properties:
        channels:
          additionalProperties: true
          title: Channels
          type: object
        cooldown_minutes:
          title: Cooldown Minutes
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        filters:
          additionalProperties: true
          title: Filters
          type: object
        id:
          title: Id
          type: string
        is_enabled:
          title: Is Enabled
          type: boolean
        name:
          title: Name
          type: string
        organization_id:
          title: Organization Id
          type: string
      required:
      - id
      - organization_id
      - name
      - filters
      - channels
      - cooldown_minutes
      - is_enabled
      - created_at
      title: AlertRuleResponse
      type: object
    ErrorEnvelope:
      properties:
        code:
          title: Code
          type: string
        field_errors:
          anyOf:
          - additionalProperties:
              items:
                type: string
              type: array
            type: object
          - type: 'null'
          title: Field Errors
        message:
          title: Message
          type: string
        retryable:
          default: false
          title: Retryable
          type: boolean
        trace_id:
          title: Trace Id
          type: string
      required:
      - code
      - message
      - trace_id
      title: ErrorEnvelope
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
      required:
      - error
      title: ErrorResponse
      type: object
    FeedbackRequest:
      additionalProperties: false
      properties:
        decision:
          pattern: ^(purchased|contacted|dismissed)$
          title: Decision
          type: string
        idempotency_key:
          maxLength: 128
          minLength: 1
          title: Idempotency Key
          type: string
        notes:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Notes
        opportunity_id:
          minLength: 1
          title: Opportunity Id
          type: string
      required:
      - opportunity_id
      - decision
      - idempotency_key
      title: FeedbackRequest
      type: object
    FeedbackResponse:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        decision:
          title: Decision
          type: string
        id:
          title: Id
          type: string
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        opportunity_id:
          title: Opportunity Id
          type: string
      required:
      - id
      - opportunity_id
      - decision
      - notes
      - created_at
      title: FeedbackResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    OpportunityListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/OpportunityResponse'
          title: Data
          type: array
        meta:
          additionalProperties: true
          title: Meta
          type: object
      required:
      - data
      - meta
      title: OpportunityListResponse
      type: object
    OpportunityResponse:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        listing_id:
          title: Listing Id
          type: string
        material_version:
          title: Material Version
          type: integer
        negative_factors:
          anyOf:
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          - type: 'null'
          title: Negative Factors
        organization_id:
          title: Organization Id
          type: string
        positive_factors:
          anyOf:
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          - type: 'null'
          title: Positive Factors
        published_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Published At
        score:
          anyOf:
          - type: string
          - type: 'null'
          title: Score
        state:
          title: State
          type: string
        valuation_id:
          title: Valuation Id
          type: string
      required:
      - id
      - organization_id
      - listing_id
      - valuation_id
      - material_version
      - score
      - state
      - published_at
      - created_at
      title: OpportunityResponse
      type: object
    OrganizationListMeta:
      properties:
        trace_id:
          title: Trace Id
          type: string
      required:
      - trace_id
      title: OrganizationListMeta
      type: object
    OrganizationListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/UserOrganizationResponse'
          title: Data
          type: array
        meta:
          $ref: '#/components/schemas/OrganizationListMeta'
      required:
      - data
      - meta
      title: OrganizationListResponse
      type: object
    StripeWebhookResponse:
      properties:
        event_id:
          title: Event Id
          type: string
        received:
          title: Received
          type: boolean
        replayed:
          title: Replayed
          type: boolean
      required:
      - received
      - event_id
      - replayed
      title: StripeWebhookResponse
      type: object
    UserOrganizationResponse:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        role:
          title: Role
          type: string
        slug:
          title: Slug
          type: string
      required:
      - id
      - name
      - slug
      - role
      - created_at
      title: UserOrganizationResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  title: ChronoArb
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/alerts/rules:
    get:
      description: Lists alert rules belonging to the authenticated organization.
      operationId: list_alert_rules_api_v1_alerts_rules_get
      parameters:
      - in: header
        name: X-Organization-ID
        required: true
        schema:
          title: X-Organization-Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AlertRuleResponse'
                title: Response List Alert Rules Api V1 Alerts Rules Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List alert rules
      tags:
      - alerts
    post:
      description: Creates a tenant-scoped alert rule.
      operationId: create_alert_rule_api_v1_alerts_rules_post
      parameters:
      - in: header
        name: X-Organization-ID
        required: true
        schema:
          title: X-Organization-Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleResponse'
          description: Successful Response
        '401':
          description: Authentication or organization membership is required.
        '403':
          description: The organization role cannot create rules.
        '422':
          description: The alert rule payload is invalid.
      security:
      - HTTPBearer: []
      summary: Create an alert rule
      tags:
      - alerts
  /api/v1/billing/stripe/webhook:
    post:
      description: Verifies and processes an idempotent Stripe event.
      operationId: stripe_webhook_api_v1_billing_stripe_webhook_post
      parameters:
      - in: header
        name: Stripe-Signature
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Stripe-Signature
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeWebhookResponse'
          description: Successful Response
        '401':
          description: The Stripe signature is missing or invalid.
        '409':
          description: The Stripe event conflicts with existing state.
        '422':
          description: The webhook payload is invalid.
      summary: Receive Stripe webhook
      tags:
      - billing
  /api/v1/feedback:
    post:
      description: Creates dealer feedback once per organization and idempotency key.
      operationId: create_feedback_api_v1_feedback_post
      parameters:
      - in: header
        name: X-Organization-ID
        required: true
        schema:
          title: X-Organization-Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
          description: Successful Response
        '401':
          description: Authentication or organization membership is required.
        '409':
          description: The idempotency key conflicts with existing feedback.
        '422':
          description: The feedback payload is invalid.
      security:
      - HTTPBearer: []
      summary: Record opportunity feedback
      tags:
      - feedback
  /api/v1/identity/organizations:
    get:
      description: Returns only organizations where the authenticated user has membership.
      operationId: list_organizations_api_v1_identity_organizations_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Authentication is required.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is invalid.
      security:
      - HTTPBearer: []
      summary: List current user's organizations
      tags:
      - identity
  /api/v1/opportunities:
    get:
      description: Returns the authenticated organization's published opportunity feed.
      operationId: list_opportunities_api_v1_opportunities_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: header
        name: X-Organization-ID
        required: true
        schema:
          title: X-Organization-Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityListResponse'
          description: Successful Response
        '401':
          description: Authentication or tenant membership is required.
        '403':
          description: The organization role cannot access this resource.
        '422':
          description: The request is invalid.
      security:
      - HTTPBearer: []
      summary: List tenant opportunities
      tags:
      - opportunities
